name: Test on DuckDB

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Cache database file
        uses: actions/cache@v4
        with:
          path: test.duckdb
          key: ${{ runner.os }}-duckdb-database-
          restore-keys: |
            ${{ runner.os }}-duckdb-database-
      - name: Overwrite Dockerfile for build and run
        run: cp -R Dockerfile.build Dockerfile
      - name: Execute create statement
        uses: ./
        with:
          command: write
          engine: duckdb
          datasource: test.duckdb
          sql: |
            queries:
              - sql: |
                  CREATE TABLE IF NOT EXISTS users (
                      id INTEGER PRIMARY KEY,
                      name VARCHAR,
                      age INTEGER
                  );
                params: []
      - name: Execute insert statement
        uses: ./
        with:
          command: write
          engine: duckdb
          datasource: test.duckdb
          sql: |
            queries:
              - sql:
                  INSERT INTO users (id, name, age) VALUES (?, ?, ?);
                params:
                  - 1
                  - hoge
                  - 20
              - sql:
                  INSERT INTO users (id, name, age) VALUES (?, ?, ?);
                params:
                  - 2
                  - fuga
                  - 30
              - sql:
                  INSERT INTO users (id, name, age) VALUES (?, ?, ?);
                params:
                  - 3
                  - piyo
                  - 40
      - name: Execute select statement
        uses: ./
        id: execute_query
        with:
          command: read
          engine: duckdb
          datasource: test.duckdb
          sql: |
            query:
              sql:
                SELECT id, name, age FROM users WHERE name = ?;
              params:
                - fuga

      - name: Show query result
        run: |
          echo "query result is: ${{ steps.execute_query.outputs.query-result }}"
